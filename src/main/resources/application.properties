spring.application.name=ScribbleApplication
server.port=${PORT:8081}

# Redis - Upstash (set REDIS_URL env var in production)
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# CORS - set ALLOWED_ORIGINS env var in production (e.g. https://your-app.vercel.app)
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}

# Room TTL in seconds (2 hours)
app.room-ttl-seconds=7200
